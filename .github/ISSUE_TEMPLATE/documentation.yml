name: 文档改进
description: 报告难懂、歧义、错字、链接或无障碍问题
title: "[文档] "
labels:
  - "documentation"
body:
  - type: markdown
    attributes:
      value: |
        请只引用仓库中已经公开的内容。隐私问题不要在这里粘贴证据，请按 `PRIVACY.md` 使用私密报告方式。
  - type: input
    id: location
    attributes:
      label: 位置
      description: 文件路径、章节标题或公开链接。
      placeholder: "例如：README.md 的“最终抵达”一节"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: 问题类型
      options:
        - 难以理解或无法复述
        - 概念或层次含混
        - 例证或比喻可能误导
        - 科学或事实表述需要核查
        - 错字、语法或格式
        - 无障碍或导航
        - 失效链接
        - 其他
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: 你遇到了什么问题？
      description: 请用自己的话说明，不要粘贴私人材料或未经授权的长篇文字。
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 建议如何改进？
      description: 可以给出一句更白话的解释、结构建议或最小修正。
  - type: textarea
    id: reader
    attributes:
      label: 读者视角（可选）
      description: 例如第一次阅读、熟悉哲学、科学传播或无障碍使用场景；不需要提供身份信息。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 本 Issue 不含私人原稿、真实经历、聊天、截图或可识别信息。
          required: true

name: 翻译贡献或问题
description: 提议新翻译、术语选择或报告版本不同步
title: "[翻译] "
labels:
  - "translation"
body:
  - type: markdown
    attributes:
      value: |
        简体中文 `zh-CN` 是当前语义基准。翻译只能基于公开文本，不得使用或索取私人原稿。
  - type: dropdown
    id: language
    attributes:
      label: 目标语言
      options:
        - 繁体中文 zh-TW
        - English en
        - 한국어 ko
        - 日本語 ja
        - Français fr
        - Italiano it
        - Deutsch de
        - Русский ru
        - Tiếng Việt vi
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: 贡献类型
      options:
        - 新语言或新章节
        - 与简体中文同步
        - 术语讨论
        - 误译或遗漏
        - 语法与可读性
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: 对应的简体中文版本
      description: 请提供公开文件路径和提交、标签或版本。
      placeholder: "例如：v0.1.0 / docs/zh-CN/README.md"
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: 翻译内容或问题
      description: 说明原词、建议译词、语境和理由。长篇翻译请通过 Pull Request 提交。
    validations:
      required: true
  - type: textarea
    id: glossary
    attributes:
      label: 关键术语
      description: 列出本次涉及的“简体中文原词—目标语言译词—简短释义”。
  - type: textarea
    id: review
    attributes:
      label: 人工复核计划
      description: 说明谁将进行目标语言和概念复核；无需提供真实姓名或私人联系方式。
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 翻译边界
      options:
        - label: 我会保留免责声明、虚构案例标记和三层陈述。
          required: true
        - label: 我不会自行把形而上公理改写为科学事实。
          required: true
        - label: 我没有使用或提交任何私人材料。
          required: true
        - label: 如使用机器翻译，我会逐段人工核对。
          required: true

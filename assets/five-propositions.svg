<svg xmlns="http://www.w3.org/2000/svg" width="760" height="740" viewBox="0 0 760 740" role="img" aria-labelledby="title desc">
  <title id="title">五个核心命题的关系</title>
  <desc id="desc">虚无、失败、自我和行动组成基础框架；第一人称分支收敛通过一项独立公理接入完整体系。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="axiom-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a6700"/>
    </marker>
    <style>
      .label { font: 600 20px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif; fill: #57606a; }
      .title { font: 700 25px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif; fill: #1f2328; }
      .subtitle { font: 400 20px -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif; fill: #57606a; }
      .step { fill: #ffffff; stroke: #8c959f; stroke-width: 2; }
      .axiom { fill: #fff8c5; stroke: #9a6700; stroke-width: 2.5; }
      .arrow { fill: none; stroke: #57606a; stroke-width: 2.5; marker-end: url(#arrow); }
      .bridge { fill: none; stroke: #9a6700; stroke-width: 2.5; stroke-dasharray: 7 6; marker-end: url(#axiom-arrow); }
    </style>
  </defs>

  <rect width="760" height="740" rx="18" fill="#f6f8fa"/>
  <text x="80" y="42" class="label">P1—P4：基础认知与行动框架</text>

  <rect x="80" y="68" width="600" height="88" rx="14" class="step"/>
  <text x="115" y="121" class="title">1　虚无</text>
  <text x="645" y="121" text-anchor="end" class="subtitle">无预设答案</text>

  <rect x="80" y="185" width="600" height="88" rx="14" class="step"/>
  <text x="115" y="238" class="title">2　失败</text>
  <text x="645" y="238" text-anchor="end" class="subtitle">局部结果</text>

  <rect x="80" y="302" width="600" height="88" rx="14" class="step"/>
  <text x="115" y="355" class="title">3　自我</text>
  <text x="645" y="355" text-anchor="end" class="subtitle">当前不是全部</text>

  <rect x="80" y="419" width="600" height="88" rx="14" class="step"/>
  <text x="115" y="472" class="title">4　行动</text>
  <text x="645" y="472" text-anchor="end" class="subtitle">反馈与修正</text>

  <path d="M 380 156 V 177" class="arrow"/>
  <path d="M 380 273 V 294" class="arrow"/>
  <path d="M 380 390 V 411" class="arrow"/>
  <path d="M 380 507 V 612" class="bridge"/>
  <text x="410" y="548" class="label" fill="#9a6700">加入独立公理</text>
  <text x="80" y="590" class="label">P5：完整体系</text>

  <rect x="80" y="620" width="600" height="96" rx="14" class="axiom"/>
  <text x="115" y="678" class="title">5　第一人称收敛</text>
  <text x="645" y="678" text-anchor="end" class="subtitle">独立形而上公理</text>
</svg>
